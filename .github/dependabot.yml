# Proposes updates to SHA-pinned GitHub Actions, the pinned configuration
# parser in .github/requirements.txt, and the hash-locked quality tools in
# tools/requirements-quality-ci.txt. Every update arrives as a pull request
# for my review; nothing merges automatically.
# Pull requests target the default branch: no target-branch is set. When a
# release branch opens, name it in target-branch so that updates go there, and
# remove target-branch again when none is active. Repository integrity fails
# while target-branch names a branch that does not exist.
# Labels must exist in .github/labels.json, include exactly one priority (P3),
# and the assignee must match the issue forms; Repository integrity checks them.
# A version update waits 14 days after its release (cooldown), so a package
# withdrawn soon after publication is never proposed. Security updates do not
# wait, and they target the default branch whatever target-branch says
# (docs/repo_governance/PULL_REQUESTS.md, Dependency updates).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - ci
      - P3
    assignees:
      - danielep71
    commit-message:
      prefix: ci
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - ci
      - P3
    assignees:
      - danielep71
    commit-message:
      prefix: ci
    cooldown:
      default-days: 14
    groups:
      configuration-parser:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - ci
      - P3
    assignees:
      - danielep71
    commit-message:
      prefix: ci
    cooldown:
      default-days: 14
    groups:
      python-quality-tools:
        patterns:
          - "*"
